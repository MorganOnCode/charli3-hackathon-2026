[project]
name = "charli3-settlement"
version = "0.1.0"
description = "MIT building blocks for price-conditional settlement on Cardano with Charli3's pull oracle."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
authors = [
    { name = "MorganOnCode", email = "morganic.thailand@gmail.com" },
]
keywords = ["cardano", "charli3", "oracle", "odv", "settlement"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "odv-multisig-charli3-client-sdk @ git+https://github.com/Charli3-Official/charli3-pull-oracle-client.git",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/MorganOnCode/charli3-hackathon-2026"

[tool.setuptools.packages.find]
where = ["."]
include = ["charli3_settlement*", "charli3_settlement_examples*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
